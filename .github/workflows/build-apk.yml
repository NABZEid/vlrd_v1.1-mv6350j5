name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Siapkan proyek Flutter
        run: |
          set -e
          if [ ! -f lib/main.dart ] && [ -f main.dart ]; then
            mkdir -p lib && mv main.dart lib/main.dart
          fi
          if [ ! -d android ]; then
            mkdir -p /tmp/keep
            cp pubspec.yaml /tmp/keep/pubspec.yaml
            cp lib/main.dart /tmp/keep/main.dart
            NAME="$(grep -m1 '^name:' pubspec.yaml | awk '{print $2}')"
            flutter create --platforms=android --org com.app --project-name "$NAME" .
            cp /tmp/keep/pubspec.yaml pubspec.yaml
            cp /tmp/keep/main.dart lib/main.dart
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Rilis APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk app.apk
          gh release create "apk-${{ github.run_number }}" app.apk --title "APK build ${{ github.run_number }}" --notes "Dibuat otomatis dari GitHub Actions" --target "${{ github.sha }}"
